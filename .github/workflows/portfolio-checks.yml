name: Portfolio V2 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/portfolio-recruiter-ready]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html && test -s dist/Ashish_Singh_Resume.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-v2-build
          path: |
            dist/
            package-lock.json
